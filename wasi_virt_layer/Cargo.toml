[package]
name = "wasi_virt_layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A virtual layer for WASI modules"
readme = "../README.md"
license-file = "../LICENSE"
repository = "https://github.com/oligamiq/wasi_virt_layer"
documentation = "https://docs.rs/wasi_virt_layer"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["wasm32-wasip1"]

[features]
default = ["std"]
alloc = []
multi_memory = ["alloc"]
own-memory = []
std = ["alloc", "wasip1/std"]
threads = ["std", "dep:parking_lot", "dep:dashmap", "parking_lot/nightly"]
trace = ["trace-fs", "trace-thread"]
trace-fs = ["simple-debug"]
trace-thread = ["simple-debug"]
embedded-fs = []
multiple-fs = ["dynamic-fs"]
dynamic-fs = ["alloc"]
simple-debug = []
# Traps when a host-routed, non-recursive WASI call synchronously re-enters
# another non-recursive WASI call on the same thread.
detect-wasi-reentrancy = ["std"]
# Tracks atomic waits and traps when an observed threaded build deadlocks.
detect-deadlock = ["threads"]
# this is unstable
unstable_print_debug = ["std", "dep:backtrace", "trace"]

[dependencies]
smallvec = { version = "1.15.1", default-features = false, features = [
    "union",
    "const_new",
] }
smallstr = { version = "0.3.0", default-features = false, features = ["union"] }
wit-bindgen = { version = "0.54.0", default-features = false }
const_struct = "0.6.4"
const_for = "0.1.5"
paste = "1.0.15"
fxhash = "0.2.1"
dashmap = { version = "7.0.0-rc2", optional = true }
# heapless = "0.8.0"
# zerocopy = "0.8.26"
# camino = "1.1.11"
parking_lot = { version = "0.12.4", optional = true }

backtrace = { version = "0.3.75", optional = true, default-features = false, features = [
    "std",
] }
# arc-slice = "0.1.0"
flume = { version = "0.12.0", default-features = false, features = ["select"] }
smallbox = "0.8.8"

# [dev-dependencies]
# wasi preview1 latest
# wasmtime-wasi = "17.0.3"

[target.'cfg(target_os = "wasi")'.dependencies]
wasip1 = { version = "1.0.0", default-features = false }
