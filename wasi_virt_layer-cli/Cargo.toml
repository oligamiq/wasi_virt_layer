[package]
name = "wasi_virt_layer-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for the wasi_virt_layer crate"
license-file = "./LICENSE"
documentation = "https://docs.rs/wasi_virt_layer-cli"
repository = "https://github.com/oligamiq/wasi_virt_layer"
publish = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata.docs.rs]
features = ["parallel"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "wasi_virt_layer"
path = "src/main.rs"

# [[bin]]
# name = "gen_translator"
# path = "src/bin/gen_translator.rs"
# test = false

[dependencies]
anyhow = "1.0.102"
camino = "1.2.2"
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["cargo", "derive"] }
color-eyre = { version = "0.6.5", default-features = false }
console = "0.16.3"
env_logger = "0.11.10"
eyre = { version = "0.6.12", default-features = false }
js-component-bindgen = "1.18.0"
log = "0.4.29"
regex = "1.12.3"
serde_json = "1.0.149"
# wasmtime-environ = { version = "35.0.0", features = ["component-model"] }
wit-component = "0.248.0"
strum = { version = "0.28.0", features = ["derive"] }
toml_edit = "0.25.11"
itertools = "0.14.0"
cfg-if = "1.0.4"
compact_str = "0.9.0"
parking_lot = "0.12.5"
strsim = "0.11.1"
paste = "1.0.15"
wait-timeout = "0.2.1"
tempfile = "3.14.0"
fs2 = "0.4.3"

# fallback
wasm-merge-sys = { version = "0.1.0", optional = true }
wasm-opt = { version = "0.116.1", optional = true }
libc = "0.2.186"
chrono = { version = "0.4.44", default-features = false, features = [
    "libc",
    "now",
    "std",
    "winapi",
] }
gag = "1.0.0"
dirs = "6.0.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
bitvec = "1.0"
smallvec = { version = "1.15.1", features = ["union", "const_generics"] }
rayon = "1.12.0"
wasmparser = "0.248.0"
wasm-encoder = "0.248.0"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Security",
] }

[features]
default = ["parallel"]
parallel = []
fallback = ["dep:wasm-merge-sys", "dep:wasm-opt"]

[dev-dependencies]
assert_cmd = "2.0.17"
glob = "0.3.1"
itertools = "0.14.0"

[dev-dependencies.uuid]
version = "1.18.1"
# Lets you generate random UUIDs
features = ["v4"]
