[package]
name = "unreachable_threads_vfs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
threads = ["wasi_virt_layer/threads"]

[dependencies]
wasi_virt_layer = { workspace = true, features = ["embedded-fs", "multi_memory", "threads"] }
wasi = "0.11"
const_struct = "0.6.6"
wit-bindgen = "0.54.0"
