resolver = "2"
default-members = ["wasi_virt_layer", "wasi_virt_layer-cli"]

[workspace.package]
authors = ["oligami <nziq53@gmail.com>"]
version = "0.5.8"
edition = "2024"
description = ""
rust-version = "1.89.0"
keywords = []
repository = ""
documentation = ""
homepage = ""
readme = "README.md"

[workspace.dependencies]
wasi_virt_layer = { path = "wasi_virt_layer", default-features = false }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.release]
tag-name = "v{{version}}"
shared-version = true
